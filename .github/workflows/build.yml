name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and package
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/package.ps1 -Version "$env:TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: bltd-enhancements-mod
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $zips = (Get-ChildItem dist/*.zip).FullName
          gh release view "$env:TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" $zips --clobber --repo "$env:GITHUB_REPOSITORY"
          }
          else {
            gh release create "$env:TAG" $zips --title "$env:TAG" --generate-notes --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
